name: Utopia Claude Code Read-Only Audit

on:
  push:
    branches: [main]
    paths:
      - '.utopia/ACTIVE_TASK.md'

concurrency:
  group: utopia-readonly-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'Muradym/claude-engineer'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout immutable version of triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit 2026-11-14
        with:
          persist-credentials: false
      - name: Validate owner-approved read-only audit task before exposing any secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('.utopia/ACTIVE_TASK.md')
          if not p.is_file():
              sys.exit('BLOCKED: task file does not exist')
          data = p.read_text(encoding='utf-8')
          def exact_field(name):
              return re.findall(r'^' + re.escape(name) + r':\s*([^\r\n#]+?)\s*$', data, flags=re.M)
          if exact_field('status') != ['approved'] or exact_field('mode') != ['read_only_audit']:
              sys.exit('BLOCKED: task must specify one status: approved and one mode: read_only_audit')
          if len(data) > 16000:
              sys.exit('BLOCKED: task file too large')
          print('PREFLIGHT PASS: explicitly approved read-only audit task; no credentials examined')
          PY

  claude-readonly:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      id-token: write # required by Anthropic's GitHub action for token exchange
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit 2026-11-14
        with:
          persist-credentials: false
      - name: Verify Anthropic credential exists without printing its value
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo 'BLOCKED: configure one Anthropic credential in this repository GitHub Secrets.' >&2
            exit 1
          fi
      - name: Run Claude Code audit with read-only tools
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1 commit verified 2026-11-14
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 10
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Write,Edit,MultiEdit,NotebookEdit,Bash"
          prompt: |
            STRICT READ ONLY. Follow CLAUDE.md and .utopia/READ_ONLY_GITHUB_AUDIT.md.
            The active task is .utopia/ACTIVE_TASK.md. Its metadata has passed
            a deterministic preflight gate for mode: read_only_audit.
            Audit only the current Utopia repository through read-only tools.
            Do not edit files, execute shell commands, create branches or PRs,
            install packages, deploy, or change GitHub settings.
            Never claim access to KOKON-OMEGA or CLAUDE-CODE-SKILLS without
            independently verifying Claude's permissions; this action's token
            is scoped to the current repository only.
            This is a PUBLIC repository and Actions logs are visible publicly.
            Never disclose secrets or confidential content. Record findings
            about public Utopia configuration only. Explain blockers factually
            in Russian, with file evidence and no fabricated runtime results.
